<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>海运运费快速报价 · 创展国际</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="header">
    <h1>海运运费快速报价</h1>
    <p>输入邮编和货物尺寸，即时查看所有渠道报价对比</p>
    <span class="tag">创展国际 · 欧美专线 · 海派</span>
  </header>

  <div class="container">

    <section class="region-switcher" aria-label="选择海运业务区域">
      <div class="section-label region-switcher-title">业务区域</div>
      <div class="region-tabs" role="tablist" aria-label="海运区域">
        <button class="region-tab is-active" type="button" role="tab" aria-selected="true" data-region="us">
          <span class="region-tab-name">美国海运</span>
          <span class="region-tab-desc">适合美国 FBA、商业地址、私人地址海派报价</span>
        </button>
        <button class="region-tab" type="button" role="tab" aria-selected="false" data-region="uk">
          <span class="region-tab-name">英国海运</span>
          <span class="region-tab-desc">适合英国 DPD、包税 / 不包税海运报价</span>
        </button>
        <button class="region-tab" type="button" role="tab" aria-selected="false" data-region="eu">
          <span class="region-tab-name">欧洲海运</span>
          <span class="region-tab-desc">适合德国、法国、意大利、西班牙等欧洲大陆海运报价</span>
        </button>
      </div>
    </section>

    <div class="card">
      <div class="card-title">基础信息</div>

      <div class="form-group region-selector-group legacy-region-select">
        <label for="regionSelect">当前海运区域</label>
        <select id="regionSelect">
          <option value="us">美国海运</option>
          <option value="uk">英国海运</option>
          <option value="eu">欧洲海运</option>
        </select>
      </div>

      <div id="usControls">
        <div class="form-grid-top" style="grid-template-columns:1fr 1fr 1fr">
          <div class="form-group">
            <label for="zip">美国邮编</label>
            <input
              id="zip"
              type="text"
              inputmode="numeric"
              maxlength="5"
              placeholder="如 90001"
              autocomplete="off"
            />
            <div id="zipHint" class="input-hint"></div>
          </div>
          <div class="form-group">
            <label for="pickupCity">交货地</label>
            <select id="pickupCity">
              <option value="shenzhen">深圳/广州交货</option>
              <option value="yiwu">义乌交货</option>
            </select>
          </div>
          <div class="form-group">
            <label for="productType">产品类型</label>
            <select id="productType">
              <option value="normal">普通货（无附加费）</option>
              <option value="textile">纺织/鞋包/帽子（A 类，+1元/kg）</option>
              <option value="toy">玩具（6岁以下，+1元/kg）</option>
              <option value="battery">电子产品 - 含电池</option>
              <option value="nobattery">电子产品 - 不含电池</option>
              <option value="wood">木制品/竹藤（商检费 +0.5元/kg）</option>
              <option value="highvalue">高价值（货值>$15/kg，+1元/kg）</option>
            </select>
            <div id="productHint" class="input-hint"></div>
          </div>
        </div>

        <div class="form-grid-top" style="margin-top:16px">
          <div class="form-group">
            <label for="destType">目的地类型</label>
            <select id="destType">
              <option value="amazon">亚马逊仓（FBA）</option>
              <option value="commercial">非亚马逊 · 商业地址</option>
              <option value="residential">非亚马逊 · 私人住宅（+25元/件）</option>
            </select>
          </div>
          <div class="form-group">
            <label>偏远地址</label>
            <div class="checkbox-group">
              <label class="checkbox-label">
                <input type="checkbox" id="isRemote" />
                <span>偏远地址（UPS/FEDEX偏远邮编）</span>
              </label>
              <div class="input-hint">偏远与否以UPS/FEDEX实际邮编表为准，可发货后6个月内补收</div>
            </div>
          </div>
        </div>

        <div class="form-grid-top" style="margin-top:12px;grid-template-columns:1fr 1fr 1fr">
          <div class="form-group">
            <label>单独报关</label>
            <div class="checkbox-group">
              <label class="checkbox-label">
                <input type="checkbox" id="needCustoms" />
                <span>需要单独报关</span>
              </label>
            </div>
          </div>
          <div class="form-group">
            <label for="customsFee">报关费（元/票）</label>
            <input
              id="customsFee"
              type="number"
              min="0"
              step="1"
              value=""
              placeholder="报关费(元/票)"
            />
          </div>
          <div class="form-group">
            <label for="exchangeRate">汇率 (USD→RMB)</label>
            <input
              id="exchangeRate"
              type="number"
              min="0.1"
              step="0.01"
              value="6.9"
              placeholder="如 6.9"
            />
            <div class="input-hint">美元报价 = 人民币 ÷ 汇率，可按当日临时调整</div>
          </div>
        </div>
      </div>

      <div id="euControls" style="display:none">
        <div class="form-grid-top" style="grid-template-columns:1fr 1fr 1fr;margin-top:16px">
          <div class="form-group">
            <label for="euTaxType">报价类型</label>
            <select id="euTaxType">
              <option value="taxed">包税</option>
              <option value="untaxed">不包税</option>
            </select>
          </div>
          <div id="ukChannelGroup" class="form-group">
            <label for="ukChannel">渠道</label>
            <select id="ukChannel">
              <option value="uk_dpd">英国DPD（普通货）</option>
              <option value="uk_battery">英国电池专线（含电池）</option>
            </select>
          </div>
          <div id="euCountryGroup" class="form-group" style="display:none">
            <label for="euCountry">目的国家</label>
            <select id="euCountry">
              <option value="de">德国</option>
              <option value="nl_cz_pl">荷兰 / 捷克 / 波兰</option>
              <option value="lu_be_sk_hu_fr">卢森堡 / 比利时 / 斯洛伐克 / 匈牙利 / 法国</option>
              <option value="lt_at_dk_hr_es_it">立陶宛 / 奥地利 / 丹麦 / 克罗地亚 / 西班牙 / 意大利</option>
              <option value="pt_se_ee">葡萄牙 / 瑞典 / 爱沙尼亚</option>
              <option value="ro_bg_ie_fi_gr_si_lv">罗马尼亚 / 保加利亚 / 爱尔兰 / 芬兰 / 希腊 / 斯洛文尼亚 / 拉脱维亚</option>
            </select>
          </div>
          <div class="form-group">
            <label for="euExchangeRate">汇率 (USD→RMB)</label>
            <input
              id="euExchangeRate"
              type="number"
              min="0.1"
              step="0.01"
              value="6.9"
              placeholder="如 6.9"
            />
            <div class="input-hint">美元报价 = 人民币 ÷ 汇率，可按当日临时调整</div>
          </div>
        </div>
      </div>

      <div class="section-label">箱型尺寸</div>
      <div id="boxPresetBar" class="box-preset-bar">
        <div class="box-preset-chips" id="boxPresetChips"></div>
        <button id="savePresetBtn" class="btn-save-preset" type="button">＋ 保存当前箱型</button>
      </div>
      <div id="boxGroups"></div>

      <button id="addBoxBtn" class="btn-add-box" type="button">+ 添加另一种箱型</button>

      <div id="euSurchargeSection" style="display:none">
        <div class="section-label">附加费（可选）</div>
        <div id="euSurchargeList" class="surcharge-list"></div>
      </div>

      <div class="btn-wrap">
        <button id="calcBtn" class="btn-calc" disabled>计算运费</button>
      </div>
    </div>

    <section class="results-section" aria-live="polite">
      <div class="section-label results-section-title">报价结果</div>
      <div id="results"></div>
    </section>

  </div>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
